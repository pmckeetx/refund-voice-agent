[project]
name = "refund-voice-agent"
version = "0.1.0"
description = "A refund desk voice agent on PolyAI's Dialog-RSN-1 whose refunds are keyed on the order in SQLite, so a backchannel, a TV or a change of mind can't pay out twice"
readme = "README.md"
authors = [
    { name = "Peter McKee", email = "peter.mckee@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "livekit>=1.0",
    "numpy>=2",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "websockets>=15",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "tests"]
testpaths = ["tests"]
markers = ["live: calls the real Dialog-RSN-1 API (needs POLYAI_LIVE=1 and POLY_API_KEY)"]
